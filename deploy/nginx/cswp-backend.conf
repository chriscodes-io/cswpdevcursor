# Include inside the cswp.dev server { } block, or use as a standalone site.
# Requires: docker compose up -d (backend listens on 127.0.0.1:3001)

upstream cswp_backend {
    server 127.0.0.1:3001;
    keepalive 8;
}

# Agiled inbound webhooks
location = /webhooks/agiled {
    proxy_pass         http://cswp_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}

# CRM API proxy (server-side Agiled access)
location /api/crm/ {
    proxy_pass         http://cswp_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location = /api/crm {
    proxy_pass         http://cswp_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Legacy webhook path (returns 410 Gone)
location = /crm {
    proxy_pass         http://cswp_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Health check
location = /health {
    proxy_pass         http://cswp_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    access_log off;
}
